retro:
  # Paired original-R-SMILES Full-SPE control for the M500 experiment.
  # Keep all optimization/model settings identical to isolate merge depth.
  vocab_size: null
  hidden_dim: 256
  num_layers: 10
  num_heads: 8
  dim_feedforward: 2048
  # Full-SPE's maximum aligned training length is 47; 96 is lossless.
  max_seq_len: 96
  dropout: 0.3
  attention_dropout: 0.3
  activation: relu
  pos_encoding_scale: true

  # 256 x 300k = 128 x 600k training examples.
  batch_size: 256
  val_batch_size: 256
  total_steps: 300000
  learning_rate_factor: 1.3
  warmup_steps: 8000
  max_grad_norm: 1.0

  scheduler: cubic
  sample_scheduler: cubic
  align_fn: opt
  n_sampling_steps: 100
  use_rate_reparam: false
  time_input: t
  clamp_kappa: false
  clamp_max: 50.0
  use_origin_mask: false

  data_dir: datasets/USPTO_50K_PtoR_aug20_SPE_full
  vocab_file: example.vocab.src

  seed: 42
  num_workers: 2
  checkpoint_interval: 10000
  keep_checkpoints: 30
  save_best_checkpoint: true

  tensorboard:
    enabled: true
    log_dir: tensorboard
    log_interval: 100
    validation_start_step: 40000
    validation_interval: 10000
    validation_batches: null
    flush_interval: 500
    flush_secs: 30

  monitoring:
    enabled: true
    interval: 1000
    jsonl: training_monitor.jsonl
