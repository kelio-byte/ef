retro:
  # Product-memory P1: keep the proven Global R-SMILES + SPE-M500 training
  # protocol fixed, and change only the model's access to immutable x_0.

  # Base state encoder (identical to retro_spe_m500_600k.yaml)
  vocab_size: null
  hidden_dim: 256
  num_layers: 10
  num_heads: 8
  dim_feedforward: 2048
  max_seq_len: 96
  dropout: 0.2
  attention_dropout: 0.2
  activation: relu
  pos_encoding_scale: true
  use_origin_mask: false

  # Product memory P1.  The raw product x_0 is encoded once with the shared
  # token embedding plus this separate two-layer encoder.  Dynamic x_t
  # queries that memory after state layers 5 and 10.  No source tokens are
  # concatenated to x_t, so the edit action space and loss stay unchanged.
  use_product_memory: true
  product_memory_encoder_layers: 2
  product_memory_fusion_after_layers: [5, 10]

  # Training: deliberately match the successful SPE-M500 baseline protocol.
  batch_size: 256
  val_batch_size: 256
  total_steps: 600000
  learning_rate_factor: 1.0
  warmup_steps: 8000
  max_grad_norm: 0.0

  # Edit Flows objective
  scheduler: cubic
  sample_scheduler: cubic
  align_fn: opt
  n_sampling_steps: 100
  use_rate_reparam: false
  time_input: t
  clamp_kappa: false
  clamp_max: 50.0

  # Established best representation / tokenizer.
  data_dir: datasets/USPTO_50K_PtoR_aug20_#global#_SPE_m500
  vocab_file: example.vocab.src

  seed: 42
  num_workers: 2
  checkpoint_interval: 10000
  keep_checkpoints: 40
  save_best_checkpoint: true

  tensorboard:
    enabled: true
    log_dir: tensorboard
    log_interval: 100
    validation_start_step: 20000
    validation_interval: 20000
    validation_batches: null
    flush_interval: 500
    flush_secs: 30

  monitoring:
    enabled: true
    interval: 1000
    jsonl: training_monitor.jsonl
