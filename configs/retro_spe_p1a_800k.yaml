retro:
  # P1-A: continue the SPE 600k final checkpoint to 800k with the
  # original Noam factor. Do not overwrite the 600k run.
  vocab_size: null
  hidden_dim: 256
  num_layers: 10
  num_heads: 8
  dim_feedforward: 2048
  max_seq_len: 256
  dropout: 0.3
  attention_dropout: 0.3
  activation: relu
  pos_encoding_scale: true

  batch_size: 128
  val_batch_size: 128
  total_steps: 800000
  learning_rate_factor: 1.0
  warmup_steps: 8000
  max_grad_norm: 0.0

  scheduler: cubic
  sample_scheduler: cubic
  align_fn: opt
  n_sampling_steps: 100
  use_rate_reparam: false
  time_input: t
  clamp_kappa: false
  clamp_max: 50.0
  use_origin_mask: false

  data_dir: datasets/USPTO_50K_PtoR_aug20_#global#_SPE
  vocab_file: example.vocab.src

  seed: 42
  num_workers: 2
  checkpoint_interval: 10000
  keep_checkpoints: 10
  save_best_checkpoint: true

  tensorboard:
    enabled: true
    log_dir: tensorboard
    log_interval: 100
    validation_start_step: 100000
    validation_interval: 20000
    validation_batches: null
    flush_interval: 500
    flush_secs: 30

  monitoring:
    enabled: true
    interval: 1000
    jsonl: training_monitor.jsonl
