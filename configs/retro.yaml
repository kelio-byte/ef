retro:
  # Model (aligned with OpenNMT R-SMILES encoder)
  vocab_size: null            # inferred from vocab file
  hidden_dim: 256
  num_layers: 10
  num_heads: 8
  dim_feedforward: 2048
  max_seq_len: 256
  dropout: 0.3
  attention_dropout: 0.3
  activation: relu
  pos_encoding_scale: true

  # Training (aligned with OpenNMT from-scratch)
  batch_size: 128
  total_steps: 600000
  learning_rate_factor: 1.0     # Noam scale factor
  warmup_steps: 8000
  max_grad_norm: 0.0            # no gradient clipping

  # Edit Flows specific
  scheduler: cubic              # kappa_t = t^3
  sample_scheduler: cubic        # scheduler used during Euler sampling (default: same as scheduler)
  align_fn: opt                 # Levenshtein DP alignment
  n_sampling_steps: 100
  use_rate_reparam: false       # predict base rates v', apply kappa scale during loss/sampling
  time_input: t                 # "t" (raw time) or "kappa" (scheduler-invariant kappa(t))
  clamp_kappa: false            # if true, clamp on 1/(1-kappa) instead of full k(t)
  clamp_max: 50.0               # max value for clamp (on k(t) or 1/(1-kappa) depending on clamp_kappa)
  use_origin_mask: false         # if true, model sees which tokens are from x_0 vs edited

  # Data
  data_dir: datasets/USPTO_50K_PtoR_aug20_#global#
  vocab_file: example.vocab.src  # relative to data_dir
