retro:
  # Atom-level product-memory control on the improved/global R-SMILES data.
  # This is a clean ablation against configs/retro_v2.yaml: the Atom
  # representation and training protocol stay unchanged; only the immutable
  # product-memory path is enabled.

  # Model
  vocab_size: null
  hidden_dim: 256
  num_layers: 10
  num_heads: 8
  dim_feedforward: 2048
  # Global atom-level pre-aligned pairs require up to 189 non-PAD tokens;
  # retain the historical lossless 256-token limit.
  max_seq_len: 256
  dropout: 0.3
  attention_dropout: 0.3
  activation: relu
  pos_encoding_scale: true

  # Immutable product memory: encode the original product x_0 separately and
  # fuse it into the dynamic x_t stream after state layers 5 and 10.
  use_origin_mask: false
  use_product_memory: true
  product_memory_encoder_layers: 2
  product_memory_fusion_after_layers: [5, 10]

  # Match the established Atom-level global-R-SMILES control. The longer
  # atom sequences use 128 examples per GPU to stay within a 24-GB card.
  batch_size: 128
  val_batch_size: 128
  total_steps: 600000
  learning_rate_factor: 1.0
  warmup_steps: 8000
  max_grad_norm: 0.0

  # Edit Flows objective
  scheduler: cubic
  sample_scheduler: cubic
  align_fn: opt
  n_sampling_steps: 100
  use_rate_reparam: false
  time_input: t
  clamp_kappa: false
  clamp_max: 50.0

  # Data: same improved/global R-SMILES representation as the Atom baseline.
  data_dir: datasets/USPTO_50K_PtoR_aug20_#global#
  vocab_file: example.vocab.src

  # Reproducibility and checkpoint policy
  seed: 42
  num_workers: 2
  checkpoint_interval: 10000
  # Keep 450K--600K available for the planned post-training sweep.
  keep_checkpoints: 40
  save_best_checkpoint: true

  tensorboard:
    enabled: true
    log_dir: tensorboard
    log_interval: 100
    # Validation is a health signal; checkpoint selection is done by
    # generation metrics after training.
    validation_start_step: 100000
    validation_interval: 20000
    validation_batches: null
    flush_interval: 500
    flush_secs: 30

  monitoring:
    enabled: true
    interval: 1000
    jsonl: training_monitor.jsonl
