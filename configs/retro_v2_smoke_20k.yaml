retro:
  # 20k-step smoke test for the current training implementation.
  # Keep configs/retro_v2.yaml unchanged as the 600k production plan.
  # Model and objective fields intentionally match the historical
  # checkpoint_step600000.pt training setup.

  # Model
  vocab_size: null
  hidden_dim: 256
  num_layers: 10
  num_heads: 8
  dim_feedforward: 2048
  max_seq_len: 256
  dropout: 0.3
  attention_dropout: 0.3
  activation: relu
  pos_encoding_scale: true

  # Training
  batch_size: 128
  val_batch_size: 128
  total_steps: 20000
  learning_rate_factor: 1.0
  warmup_steps: 8000
  max_grad_norm: 0.0

  # Edit Flows
  scheduler: cubic
  sample_scheduler: cubic
  align_fn: opt
  n_sampling_steps: 100
  use_rate_reparam: false
  time_input: t
  clamp_kappa: false
  clamp_max: 50.0
  use_origin_mask: false

  # Data
  data_dir: datasets/USPTO_50K_PtoR_aug20_#global#
  vocab_file: example.vocab.src

  # Reproducibility and checkpoint policy
  seed: 42
  num_workers: 2
  checkpoint_interval: 5000
  keep_checkpoints: 5
  save_best_checkpoint: true

  # Smoke-test validation: four validation points within 20k steps.
  # A small fixed prefix checks the validation path without adding minutes
  # of full-validation overhead. The 600k config keeps validation_batches null.
  tensorboard:
    enabled: true
    log_dir: tensorboard
    log_interval: 100
    validation_start_step: 5000
    validation_interval: 5000
    validation_batches: 20
    flush_interval: 500
    flush_secs: 30
