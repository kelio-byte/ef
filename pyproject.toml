[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "edit-flows"
version = "0.1.0"
description = "Edit Flows: Flow Matching with Edit Operations - model-agnostic implementation"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy",
    "pyyaml",
    "tqdm",
    "einops>=0.6",
    "tensorboard>=2.12",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[tool.setuptools.packages.find]
include = ["edit_flows*"]
