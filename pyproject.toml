[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "efretro"
version = "0.1.0"
description = "Reproducible product-memory SPE-M500 retrosynthesis"
requires-python = ">=3.10,<3.11"
dependencies = ["torch==2.7.1", "numpy==1.23.5", "rdkit==2026.3.4", "PyYAML==6.0.3", "tqdm==4.67.1", "tensorboard==2.21.0"]

[project.optional-dependencies]
preprocess = ["SmilesPE==0.0.3"]

[tool.setuptools.packages.find]
include = ["edit_flows*"]
